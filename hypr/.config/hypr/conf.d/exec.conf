# Iniciar el buffer de repetición al arrancar (ejemplo: últimos 30 seg)
exec-once = mkdir -p ~/Videos/Clips
# Invalida cache de monitores GDK (eww_screen.sh) por si cambio el setup
exec-once = rm -f ~/.cache/eww_gdk_monitors
# Iniciar el grabador al arrancar (usando la ruta absoluta para evitar errores)
exec-once = gpu-screen-recorder -w $(hyprctl monitors -j | jq -r '.[] | select(.focused==true) | .name') -f 60 -a default_output -r 30 -c mp4 -o $HOME/Videos/Clips

exec-once = systemctl --user start hyprpolkitagent

# Daemon SwayOSD (barra on-screen). --top-margin 0.95 = casi pegada al borde inferior
exec-once = swayosd-server --top-margin 0.95
# OSD para los cambios de volumen que no vienen del teclado (botones del casco
# por AVRCP en Bluetooth, que no generan tecla)
exec-once = ~/.local/bin/osd-vol-watch

# inicia la barra de tareas
exec-once = sleep 2 && waybar

# daemon eww precalentado (evita lag de compile en el primer toggle_*.sh)
exec-once = eww daemon

# estado inicial del teclado (us qwerty)
exec-once = ~/.config/waybar/scripts/kb_switch.sh init

# sistema de notificaciones
exec-once = swaync
exec-once = ~/.config/swaync/steam_notif.sh

# vigilante de bateria: avisa en 20/10/5/3% y apaga solo en emergencia
exec-once = ~/.config/waybar/scripts/battery_notify.sh
# refresca el icono de bateria de waybar al instante al enchufar/desenchufar
exec-once = ~/.config/waybar/scripts/battery_watch.sh

# XWayland no marca ningun output como "primary" por si solo. Sin primary, los
# juegos X11/Proton (Rocket League, Gang Beasts, y cualquier Unreal/Unity)
# enumeran el primer output de la lista o simplemente no detectan el WAM.
# DP-1 es el WAM OZDSP24240 (240Hz, monitor principal). El sleep espera a que
# XWayland haya arrancado: antes de eso xrandr no ve ningun output.
exec-once = sleep 3 && xrandr --output DP-1 --primary

# sonido (gestionado por systemd --user: pipewire.socket, pipewire-pulse.socket, wireplumber.service)

# 1. Forzar variables de entorno en D-Bus
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 2. Levantar la sesion grafica de systemd. Arrastra graphical-session.target,
#    que es el Requisite= del drop-in de wireplumber.service. Sin esta linea
#    wireplumber no arranca y solo hay "Dummy Output": no hay sonido.
exec-once = systemctl --user start hyprland-session.target

# 3. Arrancar portales limpios
exec-once = systemctl --user stop xdg-desktop-portal xdg-desktop-portal-hyprland
exec-once = systemctl --user start xdg-desktop-portal-hyprland
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal -r &

# Submap activo mientras hay CUALQUIER popup de la barra abierto (calendario,
# clima, volumen, sysmenu, temporizador, Ajustes): ESC lo cierra. Lo activa y
# lo resetea eww/scripts/popup.sh, que es el unico que abre y cierra popups.
# El resto de binds globales quedan suspendidos salvo los que se redeclaren
# aqui dentro (Hyprland solo reconoce los binds del submap activo), por eso el
# lanzador y la terminal de Claude se repiten: son los dos atajos que uno
# espera que sigan funcionando con un panel delante.
submap = popup
bind = , escape, exec, ~/.config/eww/scripts/popup.sh close
bind = SUPER, SUPER_L, exec, true
bindr = SUPER, SUPER_L, exec, ~/.config/eww/scripts/popup.sh close; ~/.config/rofi/scripts/launch_rofi.sh
bind = SUPER, C, exec, ~/.config/hypr/scripts/toggle_claude.sh
submap = reset

exec-once = sleep 2 && easyeffects --hide-window --service-mode

# invalidar cache de apps de rofi en cada arranque (el contador de usos
# vive en ~/.cache/rofi_app_uses y NO se toca)
exec-once = rm -f ~/.cache/rofi_apps.cache

# mando DS4: boton PS abre/cierra rofi; navegacion en rofi, Lutris y claude-term
exec-once = ~/.config/rofi/scripts/ds4_rofi.py

# KDE Connect (notificaciones PC -> movil). Hyprland no procesa /etc/xdg/autostart
exec-once = /usr/bin/kdeconnectd
