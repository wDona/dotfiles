# Fix DMA-BUF fixation failure en portal (bloqueaba screenshare en Discord/Vesktop)
# WLR_DRM_NO_MODIFIERS era pa wlroots viejo; Hyprland 0.55+ usa backend Aquamarine, var correcta es AQ_NO_MODIFIERS
env = AQ_NO_MODIFIERS,1

# Cursor: Catppuccin Mocha Mauve (xcursor + hyprcursor)
env = XCURSOR_THEME,catppuccin-mocha-mauve-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-mocha-mauve-cursors
env = HYPRCURSOR_SIZE,24
exec-once = hyprctl setcursor catppuccin-mocha-mauve-cursors 24
