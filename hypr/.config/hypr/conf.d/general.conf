input {
    # dvorak PRIMERO (idx 0): Hyprland resuelve los binds segun el layout 0.
    # El usuario teclea en dvorak -> los atajos deben caer en posiciones dvorak.
    # idx: 0=us-dvorak 1=us-qwerty 2=es-dvorak 3=es-qwerty
    kb_layout = us,us,es,es
    kb_variant = dvorak,,dvorak,

    accel_profile = flat
    force_no_accel = true

    touchpad {
        natural_scroll = true
    }
}

# cursor mas lento solo en el touchpad (el raton externo no se toca)
device {
    name = elan1200:00-04f3:309f-touchpad
    sensitivity = -0.4
}

# El mando de PS expone su superficie tactil como un puntero mas, asi que al
# apoyar la mano mueve el cursor. Se desactiva solo ese dispositivo: los
# botones, sticks y el clic del propio touchpad siguen llegando al juego,
# porque van por el device "wireless-controller", no por este.
device {
    name = sony-interactive-entertainment-wireless-controller-touchpad
    enabled = false
}

# 3 dedos en horizontal = cambiar de workspace (derecha: -1, izquierda: +1).
# Solo lo dispara un touchpad, asi que en la torre no hace nada: no hace falta
# condicionarlo. El sentido lo da gestures:workspace_swipe_invert (true por
# defecto); ponlo a false si prefieres el arrastre al reves.
gesture = 3, horizontal, workspace

# 3 dedos arriba/abajo = lo mismo que SUPER+Up / SUPER+Down (ver keybinds.conf):
# el special "fullscreen", no el dispatcher fullscreen. Van por 'dispatcher,
# exec' porque los dos scripts hacen mas que un toggle (mueven la ventana al
# special y la devuelven a su workspace de origen).
gesture = 3, up, dispatcher, exec, ~/.config/hypr/scripts/special_fs.sh
gesture = 3, down, dispatcher, exec, ~/.config/hypr/scripts/special_fs_exit.sh

# freesync. Se queda en 1 (siempre activo), NO en 2 (solo fullscreen): los juegos
# van a un special workspace via special_fs.sh, que no cuenta como estado
# fullscreen, asi que con vrr=2 no se activaria nunca.
#
# IMPORTANTE: con VRR hay que capar los FPS por DEBAJO del refresco, nunca justo
# en el tope. A 240 clavados en un panel de 240 te sales de la ventana variable y
# caes en vsync fijo: cada frame que no llega duplica el anterior. ~225 es el
# numero bueno para DP-2.
misc {
    vrr = 1
    # Evita que el sistema suspenda el renderizado de la ventana de fondo
    always_follow_on_dnd = true
    # IMPORTANTE: Esto evita que los juegos se minimicen al perder el foco
    focus_on_activate = true
    # Evita que las animaciones se pausen para ahorrar energía
    # vfr = false
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

render {
    # Ojo: con esto activo, una ventana GTK4 en estado fullscreen se queda en
    # negro (el buffer va directo al display y se come los frames). Los overlays
    # propios usan flotante 100% + pin en vez de fullscreen. Ver brb-overlay.
    direct_scanout = true
}
