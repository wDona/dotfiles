# en general
general {
    # El espacio entre la ventana y el borde de la pantalla
    gaps_in = 2     # Espacio entre ventanas
    gaps_out = 5    # Espacio entre ventana y borde de monitor (ponlo en 0 si quieres que toquen el borde)

    border_size = 2
    col.active_border = rgba(d946efff) rgba(f472b6ff) 90deg
    col.inactive_border = rgba(4a4a5aaa)

    # Se queda en false: el tearing necesita scanout directo, y aqui no se puede
    # tener. Lo bloquean AQ_NO_MODIFIERS (env.conf, necesario para el screenshare
    # de Discord) y el special workspace de special_fs.sh. La latencia baja la da
    # el VRR (general.conf) en su lugar.
    allow_tearing = false
    layout = dwindle # Aunque uses float, esto define el comportamiento base
}

# Grupos de ventanas (tabs estilo navegador) — pensado para apilar terminales kitty
group {
    col.border_active = rgba(d946efff) rgba(f472b6ff) 90deg
    col.border_inactive = rgba(4a4a5aaa)
    groupbar {
        enabled = true
        font_size = 11
        height = 16
        gradients = true
        col.active = rgba(d946efcc)
        col.inactive = rgba(4a4a5aaa)
        text_color = rgba(ffffffff)
    }
}

animations {
    enabled = yes

    # Curvas
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = easeOut, 0.05, 0.9, 0.1, 1.0
    bezier = easeIn, 0.4, 0.0, 1.0, 1.0

    # Animaciones base (necesarias para que el sistema funcione)
    animation = windows, 1, 4, easeOut, slide
    animation = windowsOut, 1, 4, easeIn, slide
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 5, easeOut, slide
    animation = layers, 1, 3, easeOut, slide

    # Borde animado infinito
    # Baja el 30 para que vaya más rápido (ej: 8 = muy rápido, 20 = medio)
    animation = borderangle, 1, 30, linear, loop
}

layerrule {
    name = swaync-control-center
    animation = slide top
}

layerrule {
    name = swaync-notification-window
    animation = slide top
}

layerrule {
    name = rofi
    animation = slide left
}

# Blur detras de rofi (fondo translucido en config.rasi -> @bg-col alpha 73).
layerrule = blur true, match:namespace rofi
# El umbral tiene que quedar POR DEBAJO del alpha del fondo (0.45) para que la
# lamina se difumine, y por ENCIMA de 0 para que el antialias de las esquinas
# redondeadas no arrastre blur fuera de la caja.
layerrule = ignore_alpha 0.25, match:namespace rofi

# eww: TODAS sus ventanas (dashboard, calendario, sysmenu, batmenu,
# personalizacion, clima) comparten un unico namespace gtk-layer-shell, asi que
# con una regla van las seis. Comprobado con `hyprctl layers`.
layerrule = blur true, match:namespace gtk-layer-shell
# eww deja margenes transparentes alrededor de sus cajas (.cal-box tiene
# margin: 4px). Sin este umbral esos margenes tambien se difuminan y el halo se
# sale del panel.
layerrule = ignore_alpha 0.15, match:namespace gtk-layer-shell

# swaync: el centro de control y las notificaciones son dos capas distintas.
layerrule = blur true, match:namespace swaync-control-center
layerrule = ignore_alpha 0.2, match:namespace swaync-control-center

# La capa de notificaciones ocupa toda la pantalla y es casi toda transparente:
# el umbral es imprescindible o difuminaria el escritorio entero.
layerrule = blur true, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.2, match:namespace swaync-notification-window

# Blur real detrás de los componentes de waybar.
# Fondo de barra transparente (CSS): las zonas vacias (alpha 0) no
# dibujan nada, asi el blur solo se ve bajo los modulos translucidos.
layerrule = blur true, match:namespace waybar
# Solo difumina donde alpha >= 0.05: los modulos translucidos.
# Las zonas 100% transparentes de la barra (alpha exacto 0) no se difuminan.
# Bajado de 0.1 a 0.05 porque los fondos de los modulos estan en 0.12-0.14 y
# con el umbral en 0.1 iban demasiado justos: cualquier bajada mas y se
# quedaban por debajo, apagando el blur de la barra entera.
layerrule = ignore_alpha 0.05, match:namespace waybar

# xray: el blur de la barra muestrea SOLO el wallpaper, ignorando las ventanas.
# Esto arregla el degradado que aparecia en los modulos al abrir una ventana:
# el kernel del blur muestrea pixeles por debajo del borde inferior de la
# barra, asi que una ventana clara justo debajo "subia luz" hacia los modulos
# y creaba una rampa de abajo a arriba. Sin ventanas en el muestreo, el fondo
# de la barra es uniforme siempre.
# Efecto secundario util: al no depender del contenido de las ventanas, el
# blur de la barra es mas barato de recalcular.
layerrule = xray true, match:namespace waybar

# en general
decoration {
    rounding = 16    # <--- Sube este número para esquinas más redondas (10-15 es lo ideal)

    # Saturación de pantalla. El nivel se ajusta dentro del .frag (SATURATION),
    # no aquí. Comenta esta línea para volver a los colores nativos.
    # Ojo: NO poner esto en ~/.config/hypr/shaders/, que es el directorio con
    # el que Hyprland sobreescribe sus shaders internos (tex300.vert, etc).
    screen_shader = ~/.config/hypr/screen-shaders/vibrance.frag

    # Blur (hace que el fondo de la ventana sea translúcido si la app lo permite)
    blur {
        enabled = true

        # size 7 -> 4: ~43% menos de radio de desenfoque. Con menos blur se
        # distingue el dibujo del wallpaper por detras en vez de una mancha
        # uniforme, que es justo lo que hace que los paneles se lean como
        # translucidos y no como pintura oscura.
        #
        # passes se queda en 2: NO subirlo. El blur se recalcula por frame
        # dañado y el fondo es mpvpaper (video), que se redibuja SIEMPRE, asi
        # que aqui no se cachea nunca. Pasar a 3 es ~50% mas de trabajo cada
        # frame y con CPPC todavia sin activar en la BIOS eso se paga en los
        # 1% low. Bajar size, en cambio, sale gratis o mejor.
        size = 4
        passes = 2

        # ── Cristal ───────────────────────────────────────────────
        # vibrancy satura lo que se ve detras: es LO que separa el "borroso
        # gris" del "vidrio teñido". El color lo pone el wallpaper atravesando
        # el cristal, NO la lamina (teñir la lamina de morado la deja plana).
        # Se acumula con el screen_shader vibrance.frag de arriba: por encima
        # de ~0.45 los magentas empiezan a quemarse.
        vibrancy = 0.30
        vibrancy_darkness = 0.4

        # contrast viene de fabrica en 0.89, o sea que LAVA el fondo: por eso
        # el blur por defecto se ve lechoso. Por encima de 1 recupera el dibujo
        # del backdrop y el cristal se ve nitido.
        contrast = 1.20

        # OJO: esto NO es la palanca para "mas oscuro". Lo negro lo pone la
        # lamina de cada app (#0a0a0a al 75%, igual que kitty). Si ademas se
        # oscurece aqui se apaga dos veces, detras del cristal no queda nada
        # que ver y el efecto se muere: parece pintura plana, no vidrio.
        # Se queda alto a proposito para que el wallpaper siga leyendose.
        brightness = 0.88

        # Grano fino. Rompe el banding de los degradados y da textura de
        # vidrio esmerilado en vez de plastico liso.
        noise = 0.03

        popups = true
        new_optimizations = true
    }
}
