# ─── Layout fisico: LG TV (izq) │ WAM 240Hz (centro, principal) │ LG FULL HD (der)
# Sin regla explicita caian todos en el fallback `preferred, auto`, y el WAM
# arrancaba a 60Hz pese a soportar 240.
#
# TODO se referencia por descripcion EDID (`desc:`), NO por conector (DP-1,
# DP-2...). El conector depende de en que puerto fisico esta enchufado el cable
# y cambia si los muevas; la descripcion viaja con el monitor. Asi cambiar un
# cable de puerto no obliga a tocar este archivo.
#
# Los nombres salen de `hyprctl monitors | grep description`. Se puede omitir el
# serial final: Hyprland hace match por prefijo.
#   WAM OZDSP24240 0x00000001
#   LG Electronics LG TV 0x01010101
#   LG Electronics LG FULL HD 0x01010101
# "LG TV" y "LG FULL HD" comparten fabricante y serial, pero el modelo ya los
# distingue, asi que el prefijo es unico para cada uno.

# Izquierda: LG TV pequeno, 1360x768. y=312 para alinearlo por abajo con los
# 1080p de al lado (1080-768), como estan fisicamente sobre la mesa.
monitor = desc:LG Electronics LG TV, 1360x768@59.80, 0x312, 1

# Centro y PRINCIPAL: WAM OZDSP24240 a 240Hz reales. VRR activo por EDID.
monitor = desc:WAM OZDSP24240, 1920x1080@239.96, 1360x0, 1

# Derecha: LG FULL HD 1080p60.
monitor = desc:LG Electronics LG FULL HD, 1920x1080@60, 3280x0, 1

# Asignar workspaces a cada monitor. default:true garantiza que cada pantalla
# siempre tiene al menos 1 workspace. Se pueden mover con SUPER ALT izq/der.
#
# Solo el 1-6 esta clavado a un monitor, con reparto ciclico por posicion
# fisica: el resto de dividir entre 3 decide la pantalla, asi el 1-2-3 de la
# fila de teclas se repite hacia abajo.
#   1, 4 -> WAM (centro, principal)
#   2, 5 -> LG FULL HD (derecha)
#   3, 6 -> LG TV (izquierda)
#
# Del 7 en adelante NO hay regla a proposito: son los dinamicos. Sin asignacion
# Hyprland los crea en el monitor que tenga el foco, que es justo lo que quiere
# ws_dynamic.sh (SUPER+A). Si añades aqui un workspace >= 7 dejaria de ser
# dinamico y saltaria siempre a esa pantalla.

# Centro y principal: el workspace 1 es donde arranca la sesion.
workspace = 1, monitor:desc:WAM OZDSP24240, default:true
workspace = 4, monitor:desc:WAM OZDSP24240

# Derecha.
workspace = 2, monitor:desc:LG Electronics LG FULL HD, default:true
workspace = 5, monitor:desc:LG Electronics LG FULL HD

# Izquierda.
workspace = 3, monitor:desc:LG Electronics LG TV, default:true
workspace = 6, monitor:desc:LG Electronics LG TV

# El cursor arranca en el principal, asi la primera ventana abre ahi.
cursor {
    default_monitor = desc:WAM OZDSP24240
}

# Fallback para cualquier monitor no listado arriba (portatil eDP-1, proyectores,
# TVs). Hyprland aplica primero las reglas explicitas y cae aqui para el resto;
# los workspace = ... de un monitor ausente se ignoran sin error.
monitor = , preferred, auto, 1
