windowrule {
    name = gnome-look

    opacity = 0.85 0.75
}

# discord gay
windowrule {
    name = fake-discord
    match:class = discord

    opacity = 0.90 0.87
}

# discord siempre en workspace 2
windowrule {
    name = discord-ws2
    match:class = discord
    workspace = 2 silent
}

# teamspeak siempre en workspace 2
windowrule {
    name = teamspeak-ws2
    match:class = (?i).*teamspeak.*
    workspace = 2 silent
}

# spotify siempre en workspace 3
# La clase real es "Spotify" con mayuscula y el regex es case-sensitive:
# en minuscula la regla no llegaba a aplicarse nunca.
windowrule {
    name = spotify-ws3
    match:class = (?i)^spotify$
    workspace = 3 silent
}

# vs code
windowrule {
    name = vscode-transparency
    match:class = code-url-handler
    opacity = 0.90 0.85
}

# calendario
windowrule {
    name = gsimplecal-float
    match:class = gsimplecal
    float = true
    move = 770 48
    pin = true
    opacity = 0.95 0.95
}

#
windowrule {
    name = swaync-panel
    # La clase exacta suele ser esta o 'SwayNotificationCenter'
    match:class = swaync-control-center

    float = on
    # Movemos al 37% horizontal y 10px desde arriba
    move = 37% 10
    # Forzamos que la ventana "nazca" con este tamaño
    size = 550 100
}

# Regla extra para las notificaciones flotantes (los globitos)
windowrule {
    name = swaync-globitos
    match:class = swaync-notification-window
    move = 37% 10
}

# intentar mover al centro el panel de notificaciones
windowrule {
    name = swaync-centro
    match:class = ^(swaync-control-center)$

    float = on
    move = 35% 10
    # Aquí forzamos el tamaño inicial y bloqueamos que crezca solo
    size = 550 400
    center = off
}

# intento de difuminar el fondo de las notificaciones
blurls = swaync-control-center
blurls = swaync-notification-window

# ── Claude Code desplegable ──
# Terminal kitty (class claude-term) en special:claude. Flotante, centrada, no full.
# Formato linea: el bloque windowrule{} no aplica size/center en 0.55.
windowrule {
    name = claude-dropdown
    match:class = claude-term
    float = true
    size = 700 1023
    move = 1215 52
}

# ── BRB overlay ──
# Tapa el monitor sin estado fullscreen: fullscreen activa direct_scanout y GTK4
# se queda en negro. Flotante a pantalla completa + pin = por encima de todo.
windowrule {
    name = brb-overlay
    match:class = dev.local.brb
    float = true
    pin = true
    size = 100% 100%
    move = 0 0
    rounding = 0
}

# ── Rocket League: sin regla, a proposito ──
# Se probo el tearing (`immediate` + allow_tearing) para bajar latencia y NO es
# viable en este equipo. El tearing necesita scanout directo, y aqui lo bloquean
# dos cosas que no se van a quitar:
#   1. AQ_NO_MODIFIERS (env.conf), necesario para el screenshare de Discord.
#   2. El special workspace de special_fs.sh, que siempre son 2 capas.
# Y el fullscreen real, que seria la alternativa al special, rompe los hovers del
# menu: la pantalla X es la union de los 3 monitores con DP-1 desplazado en Y, y
# XWayland mapea mal el puntero con esa geometria.
# La latencia la da el VRR (general.conf) capando los FPS a ~225, no a 240.
#
# Si algun dia hace falta una regla aqui: la clase la pone Proton, no wine, y es
# steam_app_<AppID de Steam> aunque el juego sea de Epic y lo lance Heroic.
# Rocket League es ^steam_app_252950$.

# ── Calendario eww ──
# Dialogo flotante para editar notas del calendario (GTK4 propio)
windowrule {
    name = eww-note
    match:class = eww.note
    float = true
    center = true
}
