# =============================================================================
# Prioridad de salidas de audio. Sin esto, el micro fifine y los cascos tenian
# la MISMA priority.session (1109) y WirePlumber desempataba a lo loco: acabo
# eligiendo como salida por defecto el sink del microfono, que no suena en
# ningun sitio. Sintoma: swaync ejecutaba notif_sound.sh y no se oia nada.
#
# Orden que queremos:  HyperX (2000) > HDMI (por defecto) > fifine (100)
# Asi, cuando los cascos inalambricos se apagan, cae al HDMI y nunca al micro.
# =============================================================================
monitor.alsa.rules = [
  {
    matches = [
      # El sink que expone el micro fifine: es un microfono, su salida no va
      # a ningun altavoz. Prioridad minima para que jamas sea el default.
      { node.name = "alsa_output.usb-3142_fifine_Microphone-00.analog-stereo" }
    ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver  = 100
      }
    }
  }
  {
    matches = [
      # Cascos: salida principal siempre que esten encendidos.
      { node.name = "alsa_output.usb-HP__Inc_HyperX_Cloud_III_S_Wireless_C1V51608G1-00.analog-stereo" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
]
